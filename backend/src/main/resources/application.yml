# Base configuration shared by all profiles. Secrets are never stored here: they come from environment
# variables (see .env.example). Activate a profile with SPRING_PROFILES_ACTIVE=dev|prod.
spring:
  application:
    name: console-adda
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/console_adda?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:console_adda}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always

server:
  port: 8080
  shutdown: graceful
  # Spring's ForwardedHeaderFilter honours X-Forwarded-Host *with port* (needed for same-origin CORS checks
  # behind nginx on :3000). The backend port is bound to localhost, so only nginx can set these headers.
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${API_DOCS_ENABLED:true}
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}

app:
  timezone: Asia/Kolkata
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-ttl: ${JWT_TTL:12h}
    jwt-issuer: console-adda
    enforce-password-change: true
  bootstrap:
    users: []
