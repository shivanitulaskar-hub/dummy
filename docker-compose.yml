# Console Adda: MySQL + Spring Boot backend + React/nginx frontend.
#   cp .env.example .env   # then edit secrets
#   docker compose up --build
# App: http://localhost:3000   (API docs in dev: http://localhost:8080/swagger-ui.html)
name: console-adda

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-console_adda}
      MYSQL_USER: ${MYSQL_USER:-console_adda}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    # Bound to localhost only: reachable for backups/admin tools on this machine, not from the LAN.
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build: ./backend
    image: console-adda-backend:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-console_adda}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${MYSQL_USER:-console_adda}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      JWT_TTL: ${JWT_TTL:-12h}
      APP_BOOTSTRAP_ADMIN_USERNAME: ${APP_BOOTSTRAP_ADMIN_USERNAME:-admin}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
    volumes:
      - backend-logs:/app/logs
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    image: console-adda-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Published on all interfaces so tablets/phones on the cafe Wi-Fi can open the app.
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  mysql-data:
  backend-logs:
