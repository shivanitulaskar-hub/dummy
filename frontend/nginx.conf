# Serves the React SPA and proxies /api to the Spring Boot backend (single origin, no CORS needed).

# Hashed build assets never change and can be cached for a year; everything else (index.html, API) must not be.
# Headers are set once at server level: an add_header inside a location would drop the security headers.
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $cache_control always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        # $http_host keeps the port (e.g. localhost:3000). With only $host, the backend sees a different
        # origin than the browser's Origin header and rejects same-origin requests as invalid CORS.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx is the edge proxy: overwrite (not append) so clients cannot spoof the logged IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # SPA routing: unknown paths return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
